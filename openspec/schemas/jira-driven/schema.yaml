name: jira-driven
version: 1
description: Jira-driven OpenSpec workflow - proposal (sourced from a Jira ticket) -> specs (Markdown with Gherkin-style headings) -> design -> adr -> tasks. Throughout this schema, `<target-repo>` is the repository the Jira ticket concerns; in this workflow host and target are the same repository, so `<target-repo>/adr/` is this repository's own top-level adr/ folder beside openspec/, never anything inside openspec/.
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: >
      Use the jira-import skill to load the Jira ticket's Summary, Description,
      and Acceptance Criteria verbatim before drafting the rest of this
      proposal. The ticket may come from the user's request (an ID or URL) or
      from the change's context.
      For the access probe (MCP-first, env fallback), AC-anchor detection, and
      export mechanics, follow the jira-import skill — the schema here defines
      only the workflow gates, not the mechanics. Record any gaps under Open
      Questions. Then create the
      proposal document that establishes WHY this change is needed.


      Sections:

      - **Source**: the loaded ticket (Ticket ID, verbatim Summary, verbatim
      Description, and each Acceptance Criterion on its own numbered line). This
      is populated by the jira-import skill.

      - **Why**: 1-2 sentences on the problem or opportunity. What problem does
      this solve? Why now?

      - **What Changes**: Bullet list of changes. Be specific about new
      capabilities, modifications, or removals. Mark breaking changes with
      **BREAKING**.

      - **Capabilities**: Identify which behaviour specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose behaviour is changing. Only include if spec-level behaviour changes, not just implementation details. Each needs an OpenSpec Markdown delta file at `specs/<name>/spec.md`. Check `openspec/specs/` for existing spec names. Leave empty if no behaviour changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.


      IMPORTANT: The Capabilities section is critical. It creates the contract
      between proposal and specs phases. Research existing specs before filling
      this in. Each capability listed here will need a corresponding spec file.


      Durable architectural decisions worth carrying across changes are
      distilled into ADR files at <target-repo>/adr/ by a later step after design.


      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.



      Run the Grill-Me review in two phases, gated. Follow the jira-grill-me
      skill for the full procedure (Phase 0 DQ gate, Phase 1 FQ, handle
      assignment, and the default-answer heuristic). The gate policy the
      schema owns is: Phase 0 records Decision Questions (DQ) — fundamental /
      scope decisions that gate the AC interpretation — and no Feedback
      Questions (FQ) are generated until no DQs are open. Handles `[DQx]` /
      `[FQx]` / `[ACx]` are stable process identities assigned at Grill-Me
      time, never renamed.

      After Grill-Me, offer to export the still-open questions to the Jira ticket as
      a comment so the reporter/PO can confirm or answer them; this is guided
      and requires explicit user confirmation before any write. Prefer the MCP
      write path first (pre-sync diff against existing ticket comments so a
      question already sent is never sent twice, then write per question with a
      marker on success); if MCP is not configured or a send fails, fall back to
      handing the user the ready-to-paste comment to write manually, and make
      clear that no automated sync is possible in that mode.

      When a DQ or FQ is answered locally — the agent asks the question in
      conversation and the user answers it, ticking the box as resolved —
      write that resolved answer back to the Jira ticket as a comment too, as
      its own comment carrying the same [DQx]/[FQx] handle. This is additive
      to, and never replaces, the still-open-question export above. It uses the
      same guarantees: explicit user confirmation before any write (never
      autonomous), the pre-sync diff keyed on the handle so a resolved question
      already written back is never sent twice, and the manual ready-to-paste
      fallback when no Jira access is configured. A question answered through
      the ticket (folded in by a re-import) is not written back.

      DQ comments target the ticket author (PO/ReqEng — tickets are written by
      them, so the author is the best available contact for scope decisions):
      send a `[DQx] · <question>` comment addressed to the author, who sees it,
      agrees with the DEV team and adjusts the ticket. The re-import diff picks
      up that adjustment as the resolution.

      After the comment, the change enters the `awaiting-answers` blocked
      state: add the status marker line and checkbox backlog (see the template)
      and STOP — do not proceed to specs until the user gives the resume
      signal. Once the user reports the answers arrived, run the jira-import
      skill again to load the updated ticket verbatim, fold the answers into
      ## Decision Questions / ## Open Questions, and tick the resolved boxes.
      Resume only after all boxes are ticked or the remaining gaps are
      explicitly accepted.
      If instead a DQ is resolved by a team decision (see the state machine
      below), the `Decision:` note in ## Decision Questions clears that DQ's
      gate immediately - no Jira wait and no re-import needed for it; resume as
      soon as all boxes are ticked and the remaining gaps accepted.

      DQ state machine (one-way): `awaiting-answers` -> `resolved` on a PO
      answer in the ticket OR a team decision documented as a `Decision:` note
      (when the PO is unreachable, the team decides so the workflow never
      blocks). `resolved` is a latch — a later re-import NEVER flips it back;
      a re-import with an unchanged ticket leaves an awaiting-answers DQ open.
      There is no second severity level of awaiting-answers.


      This is the foundation - specs, design, adr, and tasks all build on this.
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications for the change
    template: spec.md
    instruction: >
      GATE — If the proposal.md carries the status marker `awaiting-answers`
      (the `**Status:** awaiting-answers` line), do NOT start the specs step.
      Instead, stop and report the open questions, how long they have been
      pending, and that the answer wait must be cleared before specs can begin.
      Only proceed after the user has given the resume signal and the re-import
      has cleared the marker.

      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities
      section. A spec is a Markdown document whose requirements, scenarios,
      and delta operations are authored with the heading structure below;
      prose (context, rationale, links, Jira AC traceability) may appear
      elsewhere in the file.

      Paths:
      - New capabilities: use the exact kebab-case name from the proposal
      (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from
      openspec/specs/<capability>/ when creating the delta spec at
      specs/<capability>/spec.md.

      Delta operations (use ## headers):

      - **ADDED Requirements**: New capabilities

      - **MODIFIED Requirements**: Changed behavior - MUST include full updated
      content

      - **REMOVED Requirements**: Deprecated features - MUST include **Reason**
      and **Migration**

      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:

      - Each requirement: `### Requirement: <name>` followed by description

      - Use SHALL/MUST for normative requirements (avoid should/may)

      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format

      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3
      hashtags or bullets will fail silently.

      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:

      1. Locate the existing requirement in openspec/specs/<capability>/spec.md

      2. Copy the ENTIRE requirement block (from `### Requirement:` through all
      scenarios)

      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior

      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at
      archive time.

      If adding new concerns without changing existing behavior, use ADDED
      instead.

      Jira traceability: when the capability originates from a Jira ticket,
      add an HTML comment `<!-- AC: TICKET-ID#N -->` INSIDE the requirement
      block that implements Jira Acceptance Criterion N — directly after the
      `### Requirement:` description body and before the mapped
      `#### Scenario:` heading (scenario-level placement after a scenario's
      last step is also legal). Placement before the `### Requirement:` heading
      is an error: the native archive merge silently drops prose outside the
      requirement block, so anchors there would be lost at archive time. Every
      AC line in the ticket must map to at least one scenario in this way. See
      the jira-import skill for how the ticket content is loaded before this
      step.

      AC numbering freeze: creating the first spec.md with `<!-- AC:
      TICKET-ID#N -->` anchors is the freeze point. Before that, ACs in
      `## Source` may use provisional `[ACx]` handles (`[AC3]` for open
      questions, `[AC5] DELETED` for removed entries).
      After the freeze, only two mutations are allowed:
      append (next number, `AC-N+1`, existing anchors unchanged) and supersede
      (annotate DELETED in `## Source`, never referenced by scenarios, existing
      anchors unchanged). Renumbering existing ACs after the freeze is never
      allowed.

      Specs should be testable. Each scenario is a potential acceptance test.
      Before considering a spec complete, extract the scenarios and lint them
      with gherkin-lint via `run_acceptance.py --lint`, and run the AC gate via
      `run_acceptance.py --check-ac`, fixing every reported issue. See the
      acceptance-test-authoring skill for extraction and lint commands.
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: >
      Create the design document that explains HOW to implement the change.


      When to include design.md (create only if any apply):

      - Cross-cutting change (multiple services/modules) or new architectural
      pattern

      - New external dependency or significant data model changes

      - Security, performance, or migration complexity

      - Ambiguity that benefits from technical decisions before coding


      Prior decisions (read existing ADRs first):

      Before writing, list every file in <target-repo>/adr/. Build the supersession
      graph from each ADR's Supersedes field - an ADR is no longer in force if
      a later ADR's Supersedes points at it. Only the currently-in-force ADRs
      (accepted, not superseded) constrain this design. Older superseded ADRs
      are historical context only and MUST NOT be treated as live commitments.
      New design choices MUST be coherent with the in-force set. If a current
      ADR needs to be revisited, do not propose modifying it; flag it under
      Open Questions and let the adr step record a new superseding ADR.


      Sections:

      - **Context**: Background, current state, constraints, stakeholders

      - **Goals / Non-Goals**: What this design achieves and explicitly excludes

      - **Decisions**: Key technical choices with rationale (why X over Y?).
      Include alternatives considered for each decision.

      - **Risks / Trade-offs**: Known limitations, things that could go wrong.
      Format: [Risk] -> Mitigation

      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)

      - **Open Questions**: Outstanding decisions or unknowns to resolve.
      Include any in-force ADRs that this design suggests revisiting; the adr
      step will record the supersession.


      Focus on architecture and approach, not line-by-line implementation.

      Reference the proposal for motivation and specs for requirements.


      Good design docs explain the "why" behind technical decisions.
    requires:
      - proposal
      - specs
  - id: adr
    generates: adr.md
    description: Per-change ADR review manifest and durable decision handoff
    template: adr.md
    instruction: >
      Complete ADR review for this change by writing a concise manifest at
      openspec/changes/<change>/adr.md. This change-local file is the artifact
      completion marker for the adr step. Existing files under <target-repo>/adr/ are
      required context for the review, but they MUST NOT satisfy completion for
      a new change.


      If the change introduces a major durable architectural decision, also
      create an Architecture Decision Record under <target-repo>/adr/ (see the
      top-level description for what `<target-repo>` means).
      Repository-level ADR files
      persist across changes and MUST be written outside openspec/.


      IRON RULE - ADRs are immutable once accepted. You MUST NOT edit a prior
      ADR file under any circumstance, not its Status, not its body, not its
      date. To change a previously accepted decision, record a NEW ADR whose
      Status is "accepted, supersedes ADR-NNNN" and whose `Supersedes:` field
      names the prior one. Design consumers derive what is currently in force
      by walking Supersedes links across the folder. The prior ADR's contents
      stay frozen as a historical record.


      Process:

      1. Read every existing ADR in <target-repo>/adr/. Build the supersession graph
      from each ADR's Supersedes field. Note the highest sequence number in
      use.

      2. Re-read design.md. Identify decisions that meet ALL of these:

      - Establish a long-term architectural commitment (pattern, technology,
      boundary, contract) - not a tactical implementation detail.

      - Will affect future changes beyond this one.

      - Either aren't already captured by a currently-in-force ADR, OR
      intentionally diverge from one. If diverging, the new ADR supersedes the
      prior.

      3. For each qualifying decision, create a NEW repository-level file at
      <target-repo>/adr/NNNN-kebab-title.md, where NNNN is a 4-digit sequence one
      greater than the highest existing. Include title, Status, Date, optional
      Supersedes, and MADR-short sections: Context, Decision, and
      Consequences. If this decision replaces a prior in-force ADR, set Status to
      "accepted, supersedes ADR-NNNN", populate the `Supersedes:` field, and
      explain in Context why the prior decision is being revisited. Do NOT
      touch the prior ADR's file.

      4. Write openspec/changes/<change>/adr.md using the template. The
      manifest MUST state that ADR review completed for this change, list the
      in-force ADR context reviewed, and reference every repository-level ADR
      file created for this change. It MUST NOT duplicate full Context,
      Decision, or Consequences content from repository-level ADR files.

      5. If nothing meets the bar, do not invent ADRs. The manifest MUST
      explicitly state that no major durable architectural decisions were
      introduced and no new repository-level ADR files were created.


      Filename convention: NNNN-kebab-title.md (e.g.,
      0042-use-postgres-for-catalog.md). Sequence is monotonic across the
      whole repo and never reused.
    requires:
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: >
      Create the task list that breaks down the implementation work.


      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be
      tracked.


      Guidelines:

      - Group related tasks under ## numbered headings.

      - Each task MUST be a checkbox: `- [ ] X.Y Task description`.

      - Tasks should be small enough to complete in one session.

      - Order tasks by dependency (what must be done first?).

      - If implementation changes behaviour specs, include a task to run the
      jira-driven validation gate before archive. The gate is the OpenSpec CLI
      plus the acceptance harness:

      ```sh
      openspec validate <change> --type change --strict
      run_acceptance.py --lint
      run_acceptance.py --check-ac
      ```

      (from the repository root). `openspec validate --strict` natively enforces
      delta sections and that every requirement has at least one scenario;
      the harness `--lint` runs gherkin-lint on the extracted scenarios; the
      harness `--check-ac` enforces Jira AC traceability (every AC comment maps
      to a scenario), proposal `## Source` AC coverage, and AC-comment
      placement inside requirement blocks. gherkin-lint has no built-in
      defaults; the harness provisions its `.gherkin-lintrc` into the
      repository root at invocation time (from an existing root rc, the
      `acceptance-tests/.gherkin-lintrc` copy, or the acceptance-test-authoring
      skill's `references/gherkin-lintrc.json`), so no rc needs to be committed
      for validation to run.

      - If the repository does not yet have `acceptance-tests/`, include setup
      tasks for the stack declared by `stack:` in `openspec/config.yaml`
      (`javascript`, `python`, or `java`; `python`/behave is the expected
      default for this schema's Gherkin-formatted specs). Inline the concrete
      destination filenames from
      that stack's "Files to copy" table in the acceptance-test-authoring skill
      (`references/<stack>/SETUP.md`). If `stack:` is absent, include a first
      task to record it; do not guess it.


      Reference specs for what to build, design for how to build it, and
      <target-repo>/adr/ for durable architectural commitments to honor.

      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - adr
apply:
  requires:
    - tasks
  tracks: tasks.md
  instruction: |
    Read context files, work through pending tasks, mark complete as you go.
    Pause if you hit blockers or need clarification.
